<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
(function () {
  var th = null; try { th = localStorage.getItem('khataTheme'); } catch (e) {}
  document.documentElement.setAttribute('data-theme', th === 'light' || th === 'dark' ? th : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
})();
</script>
<title>Terminal · Nijer Khata</title>
<meta name="description" content="Nijer Khata browser terminal: navigate sections, check time and status, and see the shell commands.">
<meta name="theme-color" content="#0d1b1f">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nijer Khata · নিজের খাতা">
<meta property="og:title" content="Nijer Khata · Terminal">
<meta property="og:description" content="Run commands from the browser: navigate, check time and status.">
<meta property="og:url" content="https://mj-ahmad.github.io/mj/nijer-khata/terminal/">
<meta property="og:image" content="https://mj-ahmad.github.io/mj/nijer-khata/assets/branding/og/og-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/branding/logos/favicon/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="../assets/branding/logos/app-icons/ios-icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500&display=swap">
<style>
:root{--bg:#f3f6f4;--panel:#ffffff;--line:#d3dfd8;--ink:#14303a;--muted:#5b7270;--moss:#2e6b55;--amber:#b87914;--violet:#5f4a8b;--err:#a33a3a}
html[data-theme="dark"]{--bg:#0a1518;--panel:#0f1f23;--line:#24393e;--ink:#d8ece4;--muted:#7f9a93;--moss:#6fb896;--amber:#e0a445;--violet:#b3a1e0;--err:#e48a8a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header a{color:var(--moss);text-decoration:none;font-size:13px}
header a:hover{text-decoration:underline}
.title{font-weight:500;color:var(--ink)}
.title span{color:var(--muted);font-weight:400}
#term{flex:1;overflow-y:auto;padding:14px 16px 6px;white-space:pre-wrap;word-break:break-word;-webkit-overflow-scrolling:touch}
.line{margin:0}
.p{color:var(--moss)}
.dim{color:var(--muted)}
.ok{color:var(--moss)}
.err{color:var(--err)}
.hi{color:var(--violet)}
.amber{color:var(--amber)}
.row{display:flex;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--panel)}
.prompt{color:var(--moss);white-space:nowrap;user-select:none}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink);font:inherit;padding:4px 0;caret-color:var(--amber)}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;background:var(--panel)}
.quick button{background:none;border:1px solid var(--line);border-radius:999px;color:var(--muted);padding:3px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.quick button:hover,.quick button:focus-visible{color:var(--moss);border-color:var(--moss);outline:none}
@media (max-width:600px){body{font-size:13px}}
</style>
</head>
<body>
<header>
  <div class="title">khata <span>· nijer-khata terminal</span></div>
  <div><a href="../">← Home</a> &nbsp; <a href="../learn/">Learn</a> &nbsp; <a href="../../">MJ Ahmad</a></div>
</header>
<div id="term" aria-live="polite"></div>
<div class="quick" aria-label="Quick commands">
  <button type="button" data-run="help">help</button>
  <button type="button" data-run="status">status</button>
  <button type="button" data-run="time">time</button>
  <button type="button" data-run="subjects">subjects</button>
  <button type="button" data-run="open learn">open learn</button>
  <button type="button" data-run="open dashboard">open dashboard</button>
</div>
<form class="row" id="form" autocomplete="off">
  <span class="prompt">mj@khata:~$</span>
  <input id="cmd" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Command">
</form>

<script>
(function () {
  var term = document.getElementById('term');
  var input = document.getElementById('cmd');
  var history = [], hIdx = 0, subjects = null;
  var ROUTES = {
    home: '../', dashboard: '../#dash', learn: '../learn/', terminal: './', mj: '../../',
    '~': '../', '': '../'
  };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function print(html) {
    var d = document.createElement('div');
    d.className = 'line';
    d.innerHTML = html;
    term.appendChild(d);
    term.scrollTop = term.scrollHeight;
  }
  function echoCmd(raw) { print('<span class="p">mj@khata:~$</span> ' + esc(raw)); }
  function dhaka(date) {
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Dhaka', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(date);
  }
  function loadSubjects() {
    if (subjects) return Promise.resolve(subjects);
    return fetch('../learn/subjects.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (d) { subjects = d.subjects || []; return subjects; })
      .catch(function () { subjects = []; return subjects; });
  }
  function go(target) {
    var t = (target || '').trim().toLowerCase();
    if (ROUTES[t] !== undefined) { print('<span class="ok">opening</span> ' + esc(t)); setTimeout(function () { location.href = ROUTES[t]; }, 250); return; }
    return loadSubjects().then(function (list) {
      var hit = list.filter(function (s) { return s.slug === t; })[0];
      if (hit) { print('<span class="ok">opening</span> learn/' + esc(t)); setTimeout(function () { location.href = '../learn/' + t + '/'; }, 250); return; }
      print('<span class="err">open: no such section: ' + esc(target) + '</span> <span class="dim">(try: ls)</span>');
    });
  }

  var COMMANDS = {
    help: function () {
      print([
        '<span class="hi">Browser commands</span>',
        '  help                 show this list',
        '  ls                   list sections and learning subjects',
        '  open &lt;name&gt;          go to home, dashboard, learn, mj, or a subject slug',
        '  subjects             learning subjects with their slugs',
        '  time                 current time in Dhaka and UTC',
        '  status               entry count and latest tracking ID',
        '  theme light|dark     switch the colour theme',
        '  whoami, echo, clear',
        '',
        '<span class="hi">Full shell (on your computer, inside the project folder)</span>',
        '  ./khata start         validate and serve on http://127.0.0.1:8000',
        '  ./khata log "..."     record progress   (--category learning --mood 4)',
        '  ./khata status        database check and summary',
        '  ./khata learn list    list subjects'
      ].join('\n'));
    },
    ls: function () {
      loadSubjects().then(function (list) {
        print('<span class="hi">sections/</span>  home  dashboard  learn  terminal  mj');
        if (list.length) print('<span class="hi">learn/</span>  ' + list.map(function (s) { return esc(s.slug); }).join('  '));
      });
    },
    subjects: function () {
      loadSubjects().then(function (list) {
        if (!list.length) { print('<span class="dim">no subjects found (learn/subjects.json)</span>'); return; }
        print(list.map(function (s) { return '<span class="ok">' + esc(s.slug) + '</span>  ' + esc(s.name && s.name.en || s.slug); }).join('\n'));
      });
    },
    open: function (args) { if (!args) { print('<span class="err">usage: open &lt;name&gt;</span>'); return; } go(args); },
    cd: function (args) { COMMANDS.open(args); },
    time: function () {
      var now = new Date();
      print('Dhaka  ' + esc(dhaka(now)) + ' (UTC+06:00)\nUTC    ' + now.toISOString().replace('T', ' ').slice(0, 19));
    },
    date: function () { COMMANDS.time(); },
    status: function () {
      fetch('../data.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          var e = d.entries || [];
          var latest = e[0];
          print('entries   ' + e.length + '\nlatest    ' + (latest ? esc(latest.tracking_id) + '  ' + esc(latest.heading) : '—') +
                '\nnote      run ./khata status in the shell for the full database check');
        })
        .catch(function () { print('<span class="err">could not read data.json (serve the folder first: ./khata start)</span>'); });
    },
    theme: function (args) {
      var v = (args || '').trim();
      if (v !== 'light' && v !== 'dark') { print('<span class="err">usage: theme light|dark</span>'); return; }
      document.documentElement.setAttribute('data-theme', v);
      try { localStorage.setItem('khataTheme', v); } catch (e) {}
      print('<span class="ok">theme set to ' + v + '</span>');
    },
    whoami: function () { print('mj-ahmad · owner of Nijer Khata'); },
    echo: function (args) { print(esc(args || '')); },
    khata: function () { print('This page is the browser terminal. For commands that write data, use ./khata in the project folder (see: help).'); },
    clear: function () { term.innerHTML = ''; }
  };

  function run(raw) {
    var line = raw.trim();
    if (!line) return;
    echoCmd(line);
    history.unshift(line); hIdx = 0;
    var parts = line.split(/\s+/);
    var name = parts.shift().toLowerCase();
    var args = line.slice(line.indexOf(' ') + 1 || 0);
    if (line.indexOf(' ') < 0) args = '';
    if (name === './khata' || name === 'khata') return COMMANDS.khata();
    if (COMMANDS[name]) return COMMANDS[name](args.trim());
    print('<span class="err">' + esc(name) + ': command not found</span> <span class="dim">(type help)</span>');
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = '';
    run(v);
  });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp') { if (hIdx < history.length) { input.value = history[hIdx++] || ''; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (hIdx > 0) { hIdx--; input.value = hIdx ? history[hIdx - 1] : ''; } e.preventDefault(); }
  });
  document.querySelectorAll('[data-run]').forEach(function (b) {
    b.addEventListener('click', function () { run(b.getAttribute('data-run')); input.focus(); });
  });
  term.addEventListener('click', function () { input.focus(); });

  print('<span class="hi">Nijer Khata · নিজের খাতা</span> <span class="dim">browser terminal</span>\n' +
        'Type <span class="ok">help</span> to see commands. Try <span class="ok">time</span> or <span class="ok">open learn</span>.');
  input.focus();
})();
</script>
</body>
</html>
