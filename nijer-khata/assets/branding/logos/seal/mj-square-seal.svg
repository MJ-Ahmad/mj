<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <title>mj-square-seal</title>
  <!-- Outer Square -->
  <rect x="10" y="10" width="280" height="280" fill="black" stroke="gold" stroke-width="6"/>
  
  <!-- Inner Border -->
  <rect x="40" y="40" width="220" height="220" fill="black" stroke="white" stroke-width="3"/>
  
  <!-- MJ Monogram -->
  <text x="150" y="150" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, serif" font-size="72" fill="white" font-weight="bold">MJ</text>
  
  <!-- Wordmark -->
  <text x="150" y="210" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="28" fill="gold" letter-spacing="6">AHMAD</text>
</svg>
