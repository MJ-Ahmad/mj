<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <title>logo-xl</title>
  <rect width="800" height="400" fill="black"/>
  <!-- MJ Monogram -->
  <text x="400" y="200" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, serif" font-size="180" fill="url(#goldGradient)" font-weight="bold">MJ</text>
  <!-- Wordmark -->
  <text x="400" y="300" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="60" fill="white" letter-spacing="10">AHMAD</text>
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
</svg>
