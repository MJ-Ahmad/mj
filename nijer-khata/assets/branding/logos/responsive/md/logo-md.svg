<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <title>logo-md</title>
  <rect width="400" height="200" fill="black"/>
  <!-- MJ Monogram -->
  <text x="200" y="100" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, serif" font-size="90" fill="url(#goldGradient)" font-weight="bold">MJ</text>
  <!-- Wordmark -->
  <text x="200" y="160" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="36" fill="white" letter-spacing="6">AHMAD</text>
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
</svg>
