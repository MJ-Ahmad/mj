<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MJSovereign | Loading...</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Splash overlay styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    #splash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      color: #fff;
    }
    #splash img {
      width: 180px;
      animation: fadeIn 2s ease-in-out;
    }
    .progress-bar {
      width: 300px;
      height: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 5px;
      margin: 20px auto;
      overflow: hidden;
    }
    .progress {
      height: 100%;
      width: 0;
      background: #00ffcc;
      transition: width 0.3s ease;
    }
    .loading-text {
      margin-top: 15px;
      font-size: 1.1em;
      animation: pulse 1.5s infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- Splash overlay -->
  <div id="splash">
    <img src="logo.png" alt="MJSovereign Logo">
    <div class="progress-bar"><div class="progress"></div></div>
    <p class="loading-text">Preparing your sovereign experience...</p>
  </div>

  <!-- Splash script -->
  <script>
    let progress = document.querySelector(".progress");
    let width = 0;
    let interval = setInterval(() => {
      if (width >= 100) {
        clearInterval(interval);
        // Redirect to home.html after splash
        window.location.href = "home.html";
      } else {
        width++;
        progress.style.width = width + "%";
      }
    }, 30); // 3 seconds total
  </script>
</body>
</html>
