  <script>
    (function () {
      var root = document.documentElement;
      root.className = 'js';
      try { var t = localStorage.getItem('mj-theme'); if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t); } catch (e) {}

      /* Splash নীতি: নতুন ভিজিট / রিলোড / সরাসরি লিংকে সবসময় দেখাবে।
         শুধু সাইটের ভেতরের অন্য পেজ থেকে হোমে ফিরলে বা Back চাপলে দেখাবে না।
         (জোর করে দেখাতে ?splash=1, বন্ধ রাখতে ?splash=0) */
      var show = true;
      try {
        var q = location.search, nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        var type = nav ? nav.type : (performance.navigation ? ['navigate', 'reload', 'back_forward'][performance.navigation.type] : 'navigate');
        if (/[?&]splash=1\b/.test(q)) show = true;
        else if (/[?&]splash=0\b/.test(q)) show = false;
        else if (type === 'back_forward') show = false;
        else if (type !== 'reload' && document.referrer) {
          var r = new URL(document.referrer), base = location.pathname.replace(/index\.html$/, '');
          if (r.origin === location.origin && r.pathname.indexOf(base) === 0) show = false;
        }
      } catch (e) {}
      if (!show) root.className += ' no-splash';
    })();
  </script>
