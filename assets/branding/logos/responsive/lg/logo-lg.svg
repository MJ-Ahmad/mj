<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <title>logo-lg</title>
  <rect width="600" height="300" fill="black"/>
  <!-- MJ Monogram -->
  <text x="300" y="150" text-anchor="middle" dominant-baseline="middle"
        font-family="Georgia, serif" font-size="130" fill="url(#goldGradient)" font-weight="bold">MJ</text>
  <!-- Wordmark -->
  <text x="300" y="230" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="45" fill="white" letter-spacing="8">AHMAD</text>
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
</svg>
