<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <title>mj-wordmark-color</title>
  <rect width="400" height="120" fill="black"/>
  <!-- MJ Monogram -->
  <text x="40" y="70" font-family="Georgia, serif" font-size="48" 
        fill="url(#goldGradient)" font-weight="bold">MJ</text>
  <!-- Wordmark -->
  <text x="40" y="105" font-family="Arial, sans-serif" font-size="28" 
        fill="url(#goldGradient)" letter-spacing="4">AHMAD</text>
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="goldGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFC300"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
</svg>
