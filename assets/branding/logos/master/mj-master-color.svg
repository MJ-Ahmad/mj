<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <title>mj-master-color</title>
  <rect width="200" height="100" fill="black"/>
  <!-- M -->
  <path d="M40 70V30h10l10 25 10-25h10v40h-8V45l-8 20h-8l-8-20v25h-8z" 
        fill="url(#goldGradient)" stroke="gold" stroke-width="1"/>
  <!-- J stem -->
  <path d="M100 30h10v40h-10V30z" 
        fill="url(#goldGradient)" stroke="gold" stroke-width="1"/>
  <!-- J curve -->
  <path d="M110 70c10 0 20-5 20-20s-10-20-20-20v8c7 0 12 4 12 12s-5 12-12 12v8z" 
        fill="url(#goldGradient)" stroke="gold" stroke-width="1"/>
